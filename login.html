<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#f6dfe6"
  >

  <title>My Account | Heidi Monsen Pilates</title>

  <style>

    :root {
      --bg: #f8eef1;
      --panel: #fffafb;
      --pink: #b6788c;
      --pink-dark: #9f6276;
      --text: #5c4950;
      --muted: #8b727a;
      --line: #ecd7dd;
      --green-bg: #e9f4eb;
      --green: #4f7c59;
      --red-bg: #f9e6e9;
      --red: #a64d5c;

      font-family: Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      margin: auto;
    }

    .brand {
      text-align: center;
      margin: 15px 0 20px;
    }

    .brand-name {
      font-weight: bold;
      letter-spacing: 3px;
      color: #7d4f60;
    }

    .brand-sub {
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--muted);
      margin-top: 5px;
    }

    .top-links {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .top-links a {
      flex: 1;
      padding: 11px;
      text-align: center;
      text-decoration: none;
      color: var(--pink-dark);
      background: white;
      border: 1px solid #dcb4c1;
      border-radius: 10px;
      font-size: 14px;
    }

    .top-links a.active {
      background: #f8e8ed;
      font-weight: bold;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 8px 20px rgba(183,120,140,.07);
    }

    h1,
    h2,
    h3 {
      font-family: Georgia, serif;
      font-weight: normal;
      color: #704957;
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-bottom: 6px;
    }

    p {
      line-height: 1.5;
    }

    .tabs {
      display: flex;
      background: #f6e9ed;
      border-radius: 12px;
      padding: 5px;
      gap: 5px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      border: 0;
      background: transparent;
      color: var(--text);
      padding: 12px;
      border-radius: 9px;
      font-size: 15px;
      margin: 0;
    }

    .tab.active {
      background: white;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-size: 13px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #e5c8d1;
      border-radius: 10px;
      font-size: 16px;
    }

    button,
    .btn {
      width: 100%;
      border: 0;
      background: var(--pink);
      color: white;
      border-radius: 10px;
      padding: 14px;
      margin-top: 16px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: block;
    }

    button.secondary,
    .btn.secondary {
      background: transparent;
      color: var(--pink-dark);
      border: 1px solid #dcb4c1;
    }

    button.danger {
      background: transparent;
      color: var(--red);
      border: 1px solid #e5b8c0;
    }

    button:disabled {
      opacity: .55;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
    }

    .success {
      display: block;
      background: var(--green-bg);
      color: var(--green);
    }

    .error {
      display: block;
      background: var(--red-bg);
      color: var(--red);
    }

    .hidden {
      display: none;
    }

    .email {
      font-weight: bold;
      word-break: break-word;
    }

    .booking {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      margin-top: 12px;
      background: #fffafb;
    }

    .booking-date {
      font-weight: bold;
      color: #86566a;
    }

    .booking-meta {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .notice {
      background: #fdf3f6;
      border: 1px solid var(--line);
      padding: 13px;
      border-radius: 11px;
      margin-bottom: 15px;
      font-size: 13px;
    }

  </style>

</head>


<body>

<div class="container">

  <div class="brand">

    <div class="brand-name">
      HEIDI MONSEN
    </div>

    <div class="brand-sub">
      P I L A T E S
    </div>

  </div>


  <div class="top-links">

    <a href="./index.html">
      Home
    </a>

    <a href="./index.html?classes=1">
      Classes
    </a>

    <a
      href="./login.html"
      class="active"
    >
      Account
    </a>

  </div>


  <!-- AUTH SCREEN -->

  <div
    id="authScreen"
    class="card"
  >

    <h1>
      My Account
    </h1>


    <div
      id="returnNotice"
      class="notice hidden"
    >
      Log in or create an account to continue your booking.
    </div>


    <div class="tabs">

      <button
        id="loginTab"
        class="tab active"
        onclick="showLogin()"
      >
        Log in
      </button>

      <button
        id="signupTab"
        class="tab"
        onclick="showSignup()"
      >
        Create account
      </button>

    </div>


    <div id="loginForm">

      <label>
        Email
      </label>

      <input
        id="loginEmail"
        type="email"
        autocomplete="email"
      >


      <label>
        Password
      </label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
      >


      <button
        id="loginButton"
        onclick="login()"
      >
        Log in
      </button>

    </div>


    <div
      id="signupForm"
      class="hidden"
    >

      <label>
        Full name
      </label>

      <input
        id="signupName"
        type="text"
        autocomplete="name"
      >


      <label>
        Email
      </label>

      <input
        id="signupEmail"
        type="email"
        autocomplete="email"
      >


      <label>
        Password
      </label>

      <input
        id="signupPassword"
        type="password"
        autocomplete="new-password"
      >


      <button
        id="signupButton"
        onclick="signup()"
      >
        Create account
      </button>

    </div>


    <div
      id="message"
      class="message"
    ></div>

  </div>


  <!-- ACCOUNT SCREEN -->

  <div
    id="accountScreen"
    class="hidden"
  >

    <div class="card">

      <h2>
        My Account
      </h2>

      <p>
        Logged in as
      </p>

      <p
        id="accountEmail"
        class="email"
      ></p>


      <div
        id="continueBookingArea"
        class="hidden"
      >

        <div class="notice">
          You have a booking in progress.
        </div>

        <button
          onclick="returnToBooking()"
        >
          Continue booking
        </button>

      </div>

    </div>


    <div class="card">

      <h2>
        My Bookings
      </h2>

      <div id="bookingList">
        Loading bookings...
      </div>

    </div>


    <div class="card">

      <a
        class="btn secondary"
        href="./index.html?classes=1"
      >
        Browse classes
      </a>

      <a
        class="btn secondary"
        href="./index.html"
      >
        Back to home
      </a>

      <button
        class="danger"
        onclick="logout()"
      >
        Log out
      </button>

    </div>

  </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

<script src="./supabase-config.js"></script>


<script>

  const message =
    document.getElementById(
      "message"
    );


  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnMode =
    params.get("return");


  if (
    returnMode === "booking"
  ) {

    document
      .getElementById(
        "returnNotice"
      )
      .classList
      .remove("hidden");

  }


  function showMessage(
    text,
    type
  ) {

    message.textContent =
      text;


    message.className =
      "message " +
      type;

  }


  function clearMessage() {

    message.textContent =
      "";


    message.className =
      "message";

  }


  function showLogin() {

    clearMessage();


    document
      .getElementById(
        "loginForm"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "signupForm"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "loginTab"
      )
      .classList
      .add("active");


    document
      .getElementById(
        "signupTab"
      )
      .classList
      .remove("active");

  }


  function showSignup() {

    clearMessage();


    document
      .getElementById(
        "signupForm"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "loginForm"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "signupTab"
      )
      .classList
      .add("active");


    document
      .getElementById(
        "loginTab"
      )
      .classList
      .remove("active");

  }


  async function signup() {

    clearMessage();


    const name =
      document
        .getElementById(
          "signupName"
        )
        .value
        .trim();


    const email =
      document
        .getElementById(
          "signupEmail"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "signupPassword"
        )
        .value;


    if (
      !name ||
      !email ||
      !password
    ) {

      showMessage(
        "Please complete all fields.",
        "error"
      );

      return;

    }


    if (
      password.length < 8
    ) {

      showMessage(
        "Use a password with at least 8 characters.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "signupButton"
      );


    button.disabled =
      true;


    button.textContent =
      "Creating account...";


    try {

      const { data, error } =
        await supabaseClient
          .auth
          .signUp({

            email:
              email,

            password:
              password,

            options: {

              data: {
                full_name:
                  name
              }

            }

          });


      if (error) {
        throw error;
      }


      if (
        data &&
        data.session
      ) {

        await showAccount(
          data.user
        );

        return;

      }


      showMessage(
        "Account created. Check your email and confirm your address, then return here and log in.",
        "success"
      );

    }

    catch (error) {

      showMessage(
        error.message ||
        "Account could not be created.",
        "error"
      );

    }

    finally {

      button.disabled =
        false;


      button.textContent =
        "Create account";

    }

  }


  async function login() {

    clearMessage();


    const email =
      document
        .getElementById(
          "loginEmail"
        )
        .value
        .trim();


    const password =
      document
        .getElementById(
          "loginPassword"
        )
        .value;


    if (
      !email ||
      !password
    ) {

      showMessage(
        "Enter your email and password.",
        "error"
      );

      return;

    }


    const button =
      document.getElementById(
        "loginButton"
      );


    button.disabled =
      true;


    button.textContent =
      "Logging in...";


    try {

      const { data, error } =
        await supabaseClient
          .auth
          .signInWithPassword({

            email:
              email,

            password:
              password

          });


      if (error) {
        throw error;
      }


      if (
        returnMode === "booking"
      ) {

        returnToBooking();

        return;

      }


      await showAccount(
        data.user
      );

    }

    catch (error) {

      showMessage(
        error.message ||
        "Login failed.",
        "error"
      );

    }

    finally {

      button.disabled =
        false;


      button.textContent =
        "Log in";

    }

  }


  async function showAccount(
    user
  ) {

    document
      .getElementById(
        "authScreen"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "accountScreen"
      )
      .classList
      .remove("hidden");


    document
      .getElementById(
        "accountEmail"
      )
      .textContent =
        user.email;


    const pendingSession =
      localStorage.getItem(
        "pendingPilatesSession"
      );


    if (
      pendingSession
    ) {

      document
        .getElementById(
          "continueBookingArea"
        )
        .classList
        .remove("hidden");

    }

    else {

      document
        .getElementById(
          "continueBookingArea"
        )
        .classList
        .add("hidden");

    }


    await loadBookings();

  }


  function returnToBooking() {

    const sessionId =
      localStorage.getItem(
        "pendingPilatesSession"
      );


    if (
      !sessionId
    ) {

      window.location.href =
        "./index.html?classes=1";

      return;

    }


    window.location.href =
      "./booking.html?session=" +
      encodeURIComponent(
        sessionId
      );

  }


  async function loadBookings() {

    const list =
      document.getElementById(
        "bookingList"
      );


    list.innerHTML =
      "Loading bookings...";


    const today =
      getToday();


    const { data, error } =
      await supabaseClient
        .from("class_bookings")
        .select(`
          id,
          session_id,
          status,
          booking_type,
          booked_at,
          class_sessions (
            id,
            class_name,
            class_date,
            start_time,
            duration_minutes,
            level,
            venue
          )
        `)
        .eq(
          "status",
          "booked"
        );


    if (error) {

      console.error(error);


      list.innerHTML =
        "Your bookings could not be loaded.";


      return;

    }


    const bookings =
      (data || [])

        .filter(
          function(booking) {

            return (
              booking.class_sessions &&
              booking.class_sessions.class_date >= today
            );

          }
        )

        .sort(
          function(a, b) {

            const aTime =
              a.class_sessions.class_date +
              "T" +
              a.class_sessions.start_time;


            const bTime =
              b.class_sessions.class_date +
              "T" +
              b.class_sessions.start_time;


            return aTime.localeCompare(
              bTime
            );

          }
        );


    list.innerHTML =
      "";


    if (
      bookings.length === 0
    ) {

      list.innerHTML =
        `
          <p>
            You don't have any upcoming bookings yet.
          </p>

          <a
            class="btn secondary"
            href="./index.html?classes=1"
          >
            Find a class
          </a>
        `;


      return;

    }


    bookings.forEach(
      function(booking) {

        const session =
          booking.class_sessions;


        const date =
          new Date(
            session.class_date +
            "T12:00:00"
          );


        const formattedDate =
          date.toLocaleDateString(
            "en-GB",
            {
              weekday:
                "long",

              day:
                "numeric",

              month:
                "long"
            }
          );


        const box =
          document.createElement(
            "div"
          );


        box.className =
          "booking";


        const bookingType =
          booking.booking_type === "course"
            ? "Course booking"
            : "PAYG";


        box.innerHTML =
          `
            <div class="booking-date">
              ${escapeHtml(
                formattedDate
              )}
            </div>

            <h3>
              ${escapeHtml(
                session.level ||
                session.class_name ||
                "Mat Pilates"
              )}
            </h3>

            <div class="booking-meta">

              ${escapeHtml(
                session.start_time
                  .substring(
                    0,
                    5
                  )
              )}

              ·

              ${escapeHtml(
                String(
                  session.duration_minutes ||
                  55
                )
              )}

              minutes

              <br>

              ${escapeHtml(
                session.venue || ""
              )}

              <br>

              ${escapeHtml(
                bookingType
              )}

            </div>
          `;


        const cancel =
          document.createElement(
            "button"
          );


        cancel.className =
          "danger";


        cancel.textContent =
          "Cancel booking";


        cancel.onclick =
          function() {

            cancelBooking(
              booking.session_id
            );

          };


        box.appendChild(
          cancel
        );


        list.appendChild(
          box
        );

      }
    );

  }


  async function cancelBooking(
    sessionId
  ) {

    const confirmed =
      window.confirm(
        "Are you sure you want to cancel this booking?"
      );


    if (!confirmed) {
      return;
    }


    const { error } =
      await supabaseClient.rpc(
        "cancel_class_booking",
        {
          p_session_id:
            sessionId
        }
      );


    if (error) {

      alert(
        error.message
      );

      return;

    }


    alert(
      "Booking cancelled."
    );


    await loadBookings();

  }


  async function logout() {

    await supabaseClient
      .auth
      .signOut();


    document
      .getElementById(
        "accountScreen"
      )
      .classList
      .add("hidden");


    document
      .getElementById(
        "authScreen"
      )
      .classList
      .remove("hidden");


    showLogin();

  }


  function getToday() {

    const now =
      new Date();


    const year =
      now.getFullYear();


    const month =
      String(
        now.getMonth() + 1
      ).padStart(
        2,
        "0"
      );


    const day =
      String(
        now.getDate()
      ).padStart(
        2,
        "0"
      );


    return (
      year +
      "-" +
      month +
      "-" +
      day
    );

  }


  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  async function checkSession() {

    const { data } =
      await supabaseClient
        .auth
        .getSession();


    if (
      data &&
      data.session
    ) {

      if (
        returnMode === "booking"
      ) {

        returnToBooking();

        return;

      }


      await showAccount(
        data.session.user
      );

    }

  }


  checkSession();

</script>

</body>

</html>
